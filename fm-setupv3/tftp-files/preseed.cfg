# Preseed für Debian 13 (Anpassung für aktuelle Installer-/Mirror-Eigenheiten)
### Lokalisierung
d-i debian-installer/locale string de_DE.UTF-8
d-i keyboard-configuration/xkb-keymap select de
d-i console-setup/ask_detect boolean false
d-i console-setup/layoutcode string de

### Netzwerk (DHCP / Auto-Interface)
d-i netcfg/choose_interface select auto
d-i netcfg/disable_dhcp boolean false
d-i netcfg/get_hostname string dein-hostname
d-i netcfg/get_domain string dein.domain.local
# optional: feste IPs per preseed setzen (wenn benötigt)
# d-i netcfg/get_ipaddress string 192.168.1.100
# d-i netcfg/get_netmask string 255.255.255.0
# d-i netcfg/get_gateway string 192.168.1.1
# d-i netcfg/get_nameservers string 8.8.8.8

### Zeitzone
d-i time/zone string Europe/Berlin
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Mirror / Repository
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie
d-i apt-setup/use_mirror boolean true
# Contrib/Non-free aktivieren (hilfreich wenn Firmware benötigt wird)
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
# Optional: Security & updates automatisch aktivieren
d-i apt-setup/services-select multiselect security, updates

### Firmware / Hardware Detection
# Firmware laden erlauben (bei Bedarf non-free Firmwares)
d-i hw-detect/load_firmware boolean true
# Verhindert, dass der Installer wegen fehlender Firmware stoppt
d-i hw-detect/fatal boolean false

### Partitionierung (komplett automatisch, gesamte Platte nutzen)
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/sda
d-i partman-auto/choose_recipe select atomic
# Für UEFI-Systeme wird der Installer in der Regel automatisch eine EFI-Partition anlegen.
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/confirm_write_new_label seen true
# LVM/RAID/FSTAB-Priorisierung falls benötigt - hier minimal gehalten.

### Benutzer-Setup (nur root, kein normaler User)
# Wenn Sie lieber einen normalen Benutzer möchten, setzen Sie passwd/make-user boolean true
d-i passwd/root-password password rootpasswort
d-i passwd/root-password-again password rootpasswort
d-i passwd/make-user boolean false
# Falls Sie verschlüsselte Passwort-Hashes bevorzugen:
# d-i passwd/root-password-crypted password <CRYPTED-SHA512-HASH>

### Paketauswahl
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo vim curl wget
d-i pkgsel/upgrade select none

### Kein CD-Scan
d-i cdrom-detect/try-usb boolean true

### Keine Fragen nach Popularity Contest
popularity-contest popularity-contest/participate boolean false

### Bootloader (GRUB)
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda

### Abschluß / Reboot
d-i finish-install/reboot_in_progress note

### Late command (abschließende Skripte in Zielsystem installieren/ausführen)
# Hinweis: in-target führt die Befehle in der Zielinstallation aus.
d-i preseed/late_command string \
  in-target wget -O /root/install.sh http://192.168.20.50/pxe/install.sh && \
  in-target chmod +x /root/install.sh && \
  in-target wget -O /root/create_config_service.sh http://192.168.20.50/pxe/create_config_service.sh && \
  in-target chmod +x /root/create_config_service.sh && \
  in-target /root/create_config_service.sh

# Ende der Preseed-Datei
